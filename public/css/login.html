<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="login.css">
<title>911 Portal - Login</title>
</head>
<body>
  <!-- LEFT -->
  <div class="left">
    <div class="top-left">911 Portal</div>
    <div class="starburst">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="bottom-left">© 911 Portal 2026. All rights reserved.</div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="right-top">Create an account</div>
    <div class="form-content">
      <h1>Login</h1>
      <div class="fields">
        <div class="field">
          <label>Email</label>
          <input type="email" value="client@911portal.com">
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pass-wrap">
            <input type="password" value="password123">
            <span class="eye">◉</span>
          </div>
        </div>
      </div>
      <div class="options">
        <div><span class="check">✓</span> Remember me</div>
        <a>Forgot?</a>
      </div>
    </div>
    <button class="sign-in">SIGN IN</button>
  </div>
</body>
</html>
